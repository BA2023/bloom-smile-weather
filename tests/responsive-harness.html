<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>BLOOM 居中与手机布局验证</title><style>body{margin:16px;background:#242620;color:#eee;font:13px system-ui}h1{font-size:18px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{padding:9px 12px;color:#eee;background:#30332b;border:1px solid #65654f;border-radius:5px}button[aria-pressed=true]{background:#5b513b}iframe{display:block;border:0}p{color:#aab09e;font-size:12px}</style><h1>居中与手机首屏验证 · CSS视口，非硬件实测</h1><nav aria-label="验证视口"><button data-width="1280" data-height="720" aria-pressed="true">1280 × 720</button><button data-width="1440" data-height="900" aria-pressed="false">1440 × 900</button><button data-width="906" data-height="989" aria-pressed="false">906 × 989</button><button data-width="320" data-height="568" aria-pressed="false">320 × 568</button><button data-width="360" data-height="800" aria-pressed="false">360 × 800</button><button data-width="390" data-height="844" aria-pressed="false">390 × 844</button><button data-width="430" data-height="932" aria-pressed="false">430 × 932</button></nav><p id="viewport-label">当前 1280 × 720</p><iframe title="screen preview" src="../" width="1280" height="720"></iframe><script>const frame=document.querySelector('iframe');document.querySelectorAll('button[data-width]').forEach(button=>button.onclick=()=>{frame.width=button.dataset.width;frame.height=button.dataset.height;document.querySelectorAll('button[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelector('#viewport-label').textContent=`当前 ${frame.width} × ${frame.height}`;});</script></html>
