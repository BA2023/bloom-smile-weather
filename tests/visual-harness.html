<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>BLOOM 景深动效验证</title>
<style>body{background:#11120f;color:#e9dfcb;font:14px system-ui;margin:24px;overflow-x:clip}button{padding:12px;margin:4px;color:inherit;background:#29291e;border:1px solid #57523e;border-radius:4px}.scene{position:relative;width:360px;height:640px;margin:100px auto;overflow:hidden;border-radius:18px}#effects{position:absolute;width:100%;height:100%;background:#090c12;border:1px solid #57523e;border-radius:18px}#front{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mask-image:linear-gradient(to bottom,#000 0%,#000 60%,transparent 77%)}#stats{position:relative}</style>
<p>真实粒子引擎 · 9:16 景深验证 · 固定时刻，非设计效果图</p><div><button data-time="1.55">绽放 1.55 秒</button><button data-time="2.05">迎面 2.05 秒</button><button data-time="2.4">迎面 2.4 秒</button><button data-rain="true">雨景 4 秒</button><button data-palette="gold">鎏金</button><button data-palette="rose">绯樱</button><button data-palette="aurora">极光</button><button data-light="true">轻量模式</button></div><p id="stats"></p><div class="scene"><canvas id="effects"></canvas><canvas id="front"></canvas></div>
<script type="module">
import {ParticleEngine,projectSpark} from '../src/particles.js';
let palette='gold',time=2.05,rain=false,light=false;
function render(){const e=new ParticleEngine(document.querySelector('#effects'),document.querySelector('#front'));e.resize(360,640);e.setPalette(palette);e.lightMotion=light;const head={x:180,y:339,rx:68,ry:94,angle:0};if(!rain)e.celebrate(head);else e.rainStrength=.85;for(let t=0;t<time;t+=1/120)e.update(1/120,head);e.draw(head);const escaped=e.flybys.filter(s=>{const p=projectSpark(s,Math.max(0,s.age));return p.x<0||p.x>360||p.y<0}).length;document.querySelector('#stats').textContent=`${palette} / ${time}s / ${e.count} particles / ${e.flybys.length} foreground / ${escaped} clipped outside field of view / ${e.ripples.length} ripples / light ${light}`}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.time){time=Number(b.dataset.time);rain=false}if(b.dataset.rain){rain=true;time=4}if(b.dataset.palette)palette=b.dataset.palette;if(b.dataset.light)light=!light;render()});render();
</script></html>
