<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>BLOOM 烟花物理验证</title>
<style>body{background:#11120f;color:#e9dfcb;font:14px system-ui;margin:24px;overflow-x:clip}button{padding:11px;margin:3px;color:inherit;background:#29291e;border:1px solid #57523e;border-radius:4px}.scene{position:relative;width:360px;height:640px;margin:24px auto;overflow:hidden;border-radius:18px}#effects{position:absolute;inset:0;width:100%;height:100%;background:#090c12;border:1px solid #57523e;border-radius:18px}#front{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mask-image:linear-gradient(to bottom,#000 0%,#000 60%,transparent 77%)}#stats{font-size:12px;color:#aaa}p{margin:12px 0}</style>
<p>真实粒子引擎 · 9:16 物理与燃烧验证 · 固定时刻，非设计效果图</p><div><button data-time="1.5">升空 1.5 秒</button><button data-time="2.4">绽放 2.4 秒</button><button data-time="3.2">下坠 3.2 秒</button><button data-time="4.2">余烬 4.2 秒</button><button data-single="true">单朵烟花</button><button data-rain="true">雨景 4 秒</button><button data-palette="gold">鎏金</button><button data-palette="rose">绯樱</button><button data-palette="aurora">极光</button><button data-light="true">轻量模式</button></div><p id="stats"></p><div class="scene"><canvas id="effects"></canvas><canvas id="front"></canvas></div>
<script type="module">
import {ParticleEngine} from '../src/particles.js';
let palette='gold',time=2.4,rain=false,light=false,single=false;
function render(){const e=new ParticleEngine(document.querySelector('#effects'),document.querySelector('#front'));e.resize(360,640);e.setPalette(palette);e.lightMotion=light;const head={x:180,y:339,rx:68,ry:94,angle:0};if(!rain){if(single)e.launch(180,210,1.12,0);else e.celebrate(head)}else e.rainStrength=.85;for(let i=0;i<Math.round(time*120);i++)e.update(1/120,head);e.draw(head);document.querySelector('#stats').textContent=`${palette} / ${time}s / ${e.count} particles / ${e.flybys.length} foreground embers / ${e.collisions} collisions / light ${light}`}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.time){time=Number(b.dataset.time);rain=false;single=false}if(b.dataset.single){single=true;rain=false;time=2.6}if(b.dataset.rain){rain=true;single=false;time=4}if(b.dataset.palette)palette=b.dataset.palette;if(b.dataset.light)light=!light;render()});render();
</script></html>
